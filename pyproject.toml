# pyproject.toml

[project]
name = "docs-mcp"
version = "0.1.0"
description = "OpenAPI(Swagger)·Markdown·CSV 문서와 Google Drive/Notion 협업 문서를 하이브리드 검색(키워드+벡터)으로 제공하는 MCP 서버"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastmcp>=3.3.1",
    "anyio>=4.0",
    # Drive 서비스 계정 JWT 서명/토큰 발급 전용. Drive REST 호출 자체는 httpx 로 직접 수행하므로
    # google-api-python-client 는 도입하지 않는다.
    "google-auth>=2.30",
    # google.auth.transport.requests.Request(토큰 갱신 전송)가 하드 의존한다.
    "requests>=2.31",
    "alembic>=1.13",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    # 로컬 CPU 임베딩(intfloat/multilingual-e5-small). torch 는 CPU 전용 휠로
    # 고정한다([tool.uv.sources]/[[tool.uv.index]] 참조) — CUDA 휠은 수 GB 라
    # 서버 배포에서 불필요하게 무겁다.
    "sentence-transformers>=3.0",
    "torch>=2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
docs-mcp = "app.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: 실제 모델 다운로드/추론이 필요한 opt-in 테스트 (기본 실행에서 제외: -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 기본 규칙
    "F",   # pyflakes (미사용 변수 등)
    "I",   # isort (import 정렬)
    "N",   # 네이밍 규칙
]
ignore = []

# 절대 import만 허용 (상대 import 금지)
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.vulture]
min_confidence = 80
paths = ["app/"]
ignore_names = ["test_*", "setUp", "tearDown"]
