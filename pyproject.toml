# pyproject.toml

[project]
name = "docs-mcp"
version = "0.1.0"
description = "OpenAPI(Swagger)·Markdown·CSV 문서와 Google Drive/Notion 협업 문서를 하이브리드 검색(키워드+벡터)으로 제공하는 MCP 서버"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastmcp>=3.3.1",
    "anyio>=4.0",
    "google-genai>=1.47.0",
    # Drive 서비스 계정 JWT 서명/토큰 발급 전용. Drive REST 호출 자체는 httpx 로 직접 수행하므로
    # google-api-python-client 는 도입하지 않는다.
    "google-auth>=2.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
docs-mcp = "app.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 기본 규칙
    "F",   # pyflakes (미사용 변수 등)
    "I",   # isort (import 정렬)
    "N",   # 네이밍 규칙
]
ignore = []

# 절대 import만 허용 (상대 import 금지)
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.vulture]
min_confidence = 80
paths = ["app/"]
ignore_names = ["test_*", "setUp", "tearDown"]
