services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docs_mcp
      POSTGRES_PASSWORD: docs_mcp
      POSTGRES_DB: docs_mcp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
